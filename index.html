<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清潔劑類目錄 Chemical Product Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter','Noto Sans TC',sans-serif; background:#f4f5f7; color:#2c3e50; }

.page-header { background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); color:white; padding:32px 24px 26px; text-align:center; position:relative; }
.page-header h1 { font-size:28px; font-weight:700; margin-bottom:4px; }
.page-header .sub { font-size:13px; opacity:0.6; }

/* Language toggle */
.lang-toggle { position:absolute; top:16px; right:20px; display:flex; border-radius:8px; overflow:hidden; border:2px solid rgba(255,255,255,0.3); }
.lang-btn { padding:6px 14px; font-size:13px; font-weight:600; cursor:pointer; border:none; background:transparent; color:rgba(255,255,255,0.6); font-family:inherit; transition:all 0.2s; }
.lang-btn.active { background:rgba(255,255,255,0.2); color:white; }
.lang-btn:hover { color:white; }

.nav-bar { background:white; border-bottom:1px solid #e0e0e0; padding:12px 20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.nav-item { text-decoration:none; color:#555; padding:8px 16px; border-radius:20px; font-size:14px; font-weight:500; transition:all 0.2s; border:2px solid #e8e8e8; display:flex; align-items:center; gap:6px; }
.nav-item:hover { background:var(--cat-color); color:white; border-color:var(--cat-color); }
.nav-count { background:rgba(0,0,0,0.08); padding:1px 7px; border-radius:10px; font-size:11px; }
.nav-item:hover .nav-count { background:rgba(255,255,255,0.3); }

.container { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
.category-section { margin-bottom:40px; }
.category-header { padding:18px 24px; border-radius:12px; margin-bottom:20px; }
.cat-title { display:flex; align-items:center; gap:14px; }
.cat-icon { font-size:32px; }
.cat-title h2 { font-size:22px; font-weight:700; margin-bottom:2px; }
.cat-subtitle { font-size:13px; color:#888; }

.products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
.product-card { background:white; border-radius:12px; border:1px solid #e8e8e8; overflow:hidden; display:flex; transition:all 0.25s; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
.product-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.08); }
.product-img { width:110px; min-height:120px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#fafafa; border-right:1px solid #f0f0f0; padding:8px; }
.product-img img { max-width:100%; max-height:100px; object-fit:contain; border-radius:6px; }
.no-img { font-size:36px; opacity:0.2; }
.product-info { flex:1; padding:12px 14px; display:flex; flex-direction:column; }
.info-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
.product-name { font-size:13px; font-weight:600; color:#2c3e50; line-height:1.3; margin-bottom:1px; }
.product-name-sub { font-size:11px; color:#95a5a6; line-height:1.3; }

.stock-area { text-align:center; flex-shrink:0; }
.stock-badge { display:inline-block; min-width:36px; padding:4px 10px; border-radius:10px; font-size:16px; font-weight:700; text-align:center; transition:all 0.3s; }
.stock-label { font-size:10px; color:#aaa; margin-top:2px; }
.stock-loading { background:#f0f0f0; color:#bbb; }
.stock-ok { background:#E8F5E9; color:#2E7D32; }
.stock-low { background:#FFF8E1; color:#F57F17; }
.stock-out { background:#FFEBEE; color:#C62828; }
.stock-err { background:#f0f0f0; color:#ccc; font-size:11px; }

.product-card { position:relative; }
.product-card.disabled { opacity:0.5; }
.product-card.disabled .product-img img { filter:grayscale(100%); }
.disabled-badge { display:none; position:absolute; top:8px; left:8px; background:#E74C3C; color:white; padding:3px 10px; border-radius:8px; font-size:11px; font-weight:700; z-index:10; letter-spacing:0.5px; }
.product-card.disabled .disabled-badge { display:block; }
.status-row { display:none; margin-top:8px; padding-top:8px; border-top:1px dashed #e0e0e0; gap:6px; align-items:center; }
.state-pill { font-size:10px; font-weight:700; padding:3px 9px; border-radius:6px; margin-right:2px; }
.state-on { background:#E8F5E9; color:#2E7D32; }
.state-off { background:#f0f0f0; color:#95a5a6; }
/* toggle button shows the ACTION that will happen on click */
.toggle-btn { padding:3px 10px; border:1.5px solid #E74C3C; border-radius:4px; background:transparent; color:#E74C3C; font-size:10px; font-weight:600; cursor:pointer; transition:all 0.2s; font-family:inherit; }
.toggle-btn:hover { opacity:0.7; }
.toggle-btn.enable { border-color:#27AE60; color:#27AE60; }   /* click -> 啟用 */
.toggle-btn.disable { border-color:#E74C3C; color:#E74C3C; }  /* click -> 停用 */
.edit-btn { padding:3px 8px; border:1.5px solid #3498DB; border-radius:4px; background:transparent; color:#3498DB; font-size:10px; font-weight:600; cursor:pointer; font-family:inherit; }
.edit-btn:hover { opacity:0.7; }
.del-btn { padding:3px 8px; border:1.5px solid #95a5a6; border-radius:4px; background:transparent; color:#95a5a6; font-size:10px; font-weight:600; cursor:pointer; font-family:inherit; }
.del-btn:hover { border-color:#E74C3C; color:#E74C3C; }

.detail-table { width:100%; border-collapse:collapse; margin-top:auto; }
.detail-table td { padding:3px 0; font-size:11px; vertical-align:middle; }
.dt-label { color:#95a5a6; width:65px; font-weight:500; }
.dt-value { color:#34495e; font-weight:500; }
.rinse-yes { background:#FFF3E0; color:#E65100; padding:1px 6px; border-radius:6px; font-size:10px; font-weight:600; }
.rinse-no { background:#E8F5E9; color:#2E7D32; padding:1px 6px; border-radius:6px; font-size:10px; font-weight:600; }
.note { margin-top:6px; font-size:10px; color:#C0392B; background:#FDEDEC; padding:3px 6px; border-radius:6px; }

.stock-edit { display:none; align-items:center; gap:6px; margin-top:8px; padding-top:8px; border-top:1px dashed #e0e0e0; }
.adj-btn { width:28px; height:28px; border:1px solid #ddd; border-radius:6px; background:white; font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.adj-btn:hover { background:#3498DB; color:white; border-color:#3498DB; }
.stock-input { width:55px; height:28px; text-align:center; border:1px solid #ddd; border-radius:6px; font-size:14px; font-weight:600; font-family:inherit; }
.stock-input:focus { outline:none; border-color:#3498DB; }
.save-btn { padding:4px 12px; height:28px; border:none; border-radius:6px; background:#27AE60; color:white; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s; font-family:inherit; }
.save-btn:hover { background:#219A52; }
.save-btn.saving { background:#95a5a6; cursor:wait; }
.save-btn.saved { background:#2ECC71; }
.save-btn.error { background:#E74C3C; }

.admin-fab { position:fixed; bottom:24px; right:24px; padding:12px 22px; border:none; border-radius:30px; font-size:15px; font-weight:600; cursor:pointer; z-index:200; transition:all 0.3s; box-shadow:0 4px 16px rgba(0,0,0,0.2); font-family:inherit; }
.admin-fab.locked { background:#2c3e50; color:white; }
.admin-fab.unlocked { background:#27AE60; color:white; }
.admin-fab:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(0,0,0,0.3); }
.add-fab { position:fixed; bottom:24px; right:150px; padding:12px 22px; border:none; border-radius:30px; font-size:15px; font-weight:600; cursor:pointer; z-index:200; background:#3498DB; color:white; box-shadow:0 4px 16px rgba(0,0,0,0.2); font-family:inherit; display:none; }
.add-fab:hover { transform:translateY(-2px); }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal-box { background:white; border-radius:16px; padding:32px; max-width:360px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
.modal-box h3 { font-size:20px; margin-bottom:6px; }
.modal-box .modal-sub { font-size:13px; color:#888; margin-bottom:20px; }
.modal-box input, .modal-box select { width:100%; padding:12px 16px; border:2px solid #e0e0e0; border-radius:10px; font-size:15px; font-family:inherit; margin-bottom:12px; background:white; }
.modal-box input:focus, .modal-box select:focus { outline:none; border-color:#3498DB; }
.modal-btns { display:flex; gap:10px; }
.modal-btns button { flex:1; padding:10px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; transition:all 0.2s; }
.btn-login { background:#2c3e50; color:white; }
.btn-login:hover { background:#1a252f; }
.btn-cancel { background:#f0f0f0; color:#666; }
.btn-cancel:hover { background:#e0e0e0; }
.modal-error { color:#E74C3C; font-size:13px; margin-top:10px; display:none; }

/* Product add/edit modal */
.form-modal { max-width:520px; max-height:90vh; overflow-y:auto; }
.form-modal .row2 { display:flex; gap:10px; }
.form-modal .row2 > div { flex:1; }
.form-modal label { display:block; font-size:12px; font-weight:600; color:#7f8c8d; margin-bottom:4px; }
.form-modal .img-preview { width:100%; height:120px; border:2px dashed #e0e0e0; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; background:#fafafa; overflow:hidden; }
.form-modal .img-preview img { max-width:100%; max-height:100%; object-fit:contain; }

.status-bar { display:none; background:#27AE60; color:white; text-align:center; padding:8px; font-size:13px; font-weight:500; }
.status-bar.show { display:block; }

.page-footer { text-align:center; padding:20px; color:#aaa; font-size:12px; border-top:1px solid #e8e8e8; margin-top:20px; }
.loading-hint { text-align:center; padding:60px 20px; color:#aaa; font-size:15px; }

/* Module switcher */
.module-bar { background:#fff; border-bottom:1px solid #e0e0e0; display:flex; justify-content:center; gap:8px; padding:10px 12px; position:sticky; top:0; z-index:110; box-shadow:0 2px 8px rgba(0,0,0,0.04); flex-wrap:wrap; }
.module-btn { padding:8px 18px; border-radius:22px; border:2px solid #e8e8e8; background:#fff; font-weight:600; cursor:pointer; font-family:inherit; font-size:14px; display:flex; align-items:center; gap:6px; color:#555; transition:all 0.2s; }
.module-btn:hover { border-color:#0f3460; }
.module-btn.active { background:#0f3460; color:#fff; border-color:#0f3460; }

/* Empty state */
.empty-state { text-align:center; padding:50px 20px; color:#bbb; }
.empty-state .ico { font-size:46px; opacity:0.4; display:block; margin-bottom:10px; }

/* Vacuum module */
.vac-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; }
.vac-card { background:#fff; border-radius:12px; border:1px solid #e8e8e8; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.04); transition:all 0.25s; }
.vac-card:hover { box-shadow:0 6px 20px rgba(0,0,0,0.08); }
.vac-card.scrap { opacity:0.55; }
.vac-top { display:flex; gap:12px; padding:12px 14px; }
.vac-img { width:88px; height:88px; flex-shrink:0; border-radius:8px; background:#fafafa; display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid #f0f0f0; }
.vac-img img { max-width:100%; max-height:100%; object-fit:contain; }
.vac-head { flex:1; }
.vac-model { font-size:15px; font-weight:700; color:#2c3e50; line-height:1.3; }
.vac-brand { font-size:12px; color:#95a5a6; margin-top:1px; }
.vac-badges { margin-top:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.floor-badge { display:inline-block; background:#EAF2F8; color:#2E86C1; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; }
.vac-status { font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; }
.vs-ok { background:#E8F5E9; color:#2E7D32; }
.vs-repair { background:#FFF3E0; color:#E65100; }
.vs-scrap { background:#f0f0f0; color:#95a5a6; }
.vac-notes { font-size:12px; color:#7f8c8d; padding:0 14px 8px; }
.maint-box { border-top:1px dashed #e0e0e0; padding:10px 14px; }
.maint-title { font-size:12px; font-weight:700; color:#7f8c8d; margin-bottom:6px; }
.maint-item { font-size:12px; color:#34495e; padding:5px 0; border-bottom:1px solid #f5f5f5; display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.maint-date { color:#95a5a6; white-space:nowrap; font-size:11px; }
.maint-empty { font-size:12px; color:#c0c0c0; padding:3px 0; }
.maint-del { border:none; background:none; color:#ccc; cursor:pointer; font-size:13px; line-height:1; padding:0 2px; }
.maint-del:hover { color:#E74C3C; }
.vac-actions { display:flex; gap:6px; padding:0 14px 12px; flex-wrap:wrap; align-items:center; }
.mini-btn { font-size:11px; padding:3px 10px; border-radius:5px; border:1.5px solid #3498DB; background:transparent; color:#3498DB; cursor:pointer; font-family:inherit; font-weight:600; }
.mini-btn:hover { opacity:0.7; }
.mini-btn.warn { border-color:#E67E22; color:#E67E22; }
.mini-btn.grey { border-color:#95a5a6; color:#95a5a6; }
.mini-btn.grey:hover { border-color:#E74C3C; color:#E74C3C; }
.form-modal textarea { width:100%; padding:10px 14px; border:2px solid #e0e0e0; border-radius:10px; font-size:14px; font-family:inherit; margin-bottom:12px; resize:vertical; min-height:60px; }
.form-modal textarea:focus { outline:none; border-color:#3498DB; }

@media (max-width:700px) {
  .page-header h1 { font-size:22px; }
  .products-grid { grid-template-columns:1fr; }
  .vac-grid { grid-template-columns:1fr; }
  .module-btn { font-size:13px; padding:7px 14px; }
  .nav-bar { gap:6px; padding:10px 12px; }
  .nav-item { font-size:12px; padding:6px 12px; }
  .container { padding:16px 12px 40px; }
  .product-img { width:90px; }
  .admin-fab { bottom:16px; right:16px; padding:10px 18px; font-size:13px; }
  .add-fab { bottom:16px; right:130px; padding:10px 18px; font-size:13px; }
  .lang-toggle { top:10px; right:10px; }
  .lang-btn { padding:4px 10px; font-size:11px; }
}
</style>
</head>
<body>

<div class="page-header">
  <h1 data-zh="酒店後勤系統" data-en="Hotel Back-of-House">酒店後勤系統</h1>
  <div class="sub" id="headerSub" data-zh="物料與設備管理" data-en="Supplies & Equipment">物料與設備管理</div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnZh" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" id="btnEn" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="status-bar" id="statusBar" data-zh="已登入管理員模式 — 可修改資料" data-en="Admin mode — You can edit data">已登入管理員模式 — 可修改資料</div>

<div class="module-bar" id="moduleBar">
  <button class="module-btn active" data-m="cleaning" onclick="setModule('cleaning')">🧴 <span data-zh="清潔劑" data-en="Chemicals">清潔劑</span></button>
  <button class="module-btn" data-m="vacuum" onclick="setModule('vacuum')">🌀 <span data-zh="吸塵機" data-en="Vacuums">吸塵機</span></button>
  <button class="module-btn" data-m="tool" onclick="setModule('tool')">🧹 <span data-zh="清潔工具" data-en="Tools">清潔工具</span></button>
</div>

<div class="container" id="container">
  <div class="loading-hint" data-zh="載入中…" data-en="Loading…">載入中…</div>
</div>

<button class="add-fab" id="addFab" onclick="openAddForModule()"><span id="addFabLabel" data-zh="＋ 新增產品" data-en="＋ Add">＋ 新增產品</span></button>
<button class="admin-fab locked" id="adminFab" onclick="toggleAdmin()"><span data-zh="🔒 管理員" data-en="🔒 Admin">🔒 管理員</span></button>

<!-- Login modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <h3 data-zh="🔒 管理員登入" data-en="🔒 Admin Login">🔒 管理員登入</h3>
    <div class="modal-sub" data-zh="輸入密碼後可修改庫存與產品" data-en="Enter password to edit stock and products">輸入密碼後可修改庫存與產品</div>
    <input type="password" id="pwdInput" data-zh-placeholder="請輸入密碼" data-en-placeholder="Enter password" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()" data-zh="取消" data-en="Cancel">取消</button>
      <button class="btn-login" onclick="doLogin()" data-zh="登入" data-en="Login">登入</button>
    </div>
    <div class="modal-error" id="modalError" data-zh="密碼錯誤，請重試" data-en="Wrong password, please try again">密碼錯誤，請重試</div>
  </div>
</div>

<!-- Product add/edit modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box form-modal">
    <h3 id="pmTitle" data-zh="新增產品" data-en="Add product">新增產品</h3>
    <div class="modal-sub" data-zh="填寫產品資料" data-en="Fill in product details">填寫產品資料</div>

    <label data-zh="類別" data-en="Category">類別</label>
    <select id="pfCategory"></select>

    <div class="row2">
      <div><label data-zh="名稱（中）" data-en="Name (ZH)">名稱（中）</label><input id="pfNameZh"></div>
      <div><label data-zh="名稱（英）" data-en="Name (EN)">名稱（英）</label><input id="pfNameEn"></div>
    </div>

    <label data-zh="圖片" data-en="Image">圖片</label>
    <div class="img-preview" id="pfImgPreview"><span class="no-img">🧴</span></div>
    <input type="file" id="pfImgFile" accept="image/*" onchange="onPickImage(event)">

    <div class="row2">
      <div><label data-zh="適用範圍（中）" data-en="Applicable (ZH)">適用範圍（中）</label><input id="pfAppZh"></div>
      <div><label data-zh="適用範圍（英）" data-en="Applicable (EN)">適用範圍（英）</label><input id="pfAppEn"></div>
    </div>
    <div class="row2">
      <div><label data-zh="兌水比例（中）" data-en="Dilution (ZH)">兌水比例（中）</label><input id="pfDilZh"></div>
      <div><label data-zh="兌水比例（英）" data-en="Dilution (EN)">兌水比例（英）</label><input id="pfDilEn"></div>
    </div>
    <div class="row2">
      <div>
        <label data-zh="需要過水" data-en="Rinse">需要過水</label>
        <select id="pfRinse">
          <option value="no" data-zh="不需要" data-en="Not required">不需要</option>
          <option value="yes" data-zh="需要" data-en="Required">需要</option>
        </select>
      </div>
      <div><label data-zh="初始庫存" data-en="Stock">初始庫存</label><input type="number" id="pfStock" min="0" value="0"></div>
    </div>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeProductForm()" data-zh="取消" data-en="Cancel">取消</button>
      <button class="btn-login" id="pfSaveBtn" onclick="saveProductForm()" data-zh="儲存" data-en="Save">儲存</button>
    </div>
    <div class="modal-error" id="pfError">Error</div>
  </div>
</div>

<!-- Vacuum add/edit modal -->
<div class="modal-overlay" id="vacuumModal">
  <div class="modal-box form-modal">
    <h3 id="vmTitle" data-zh="新增吸塵機" data-en="Add vacuum">新增吸塵機</h3>
    <div class="modal-sub" data-zh="每台獨立管理" data-en="Tracked individually">每台獨立管理</div>

    <div class="row2">
      <div><label data-zh="型號" data-en="Model">型號</label><input id="vfModel"></div>
      <div><label data-zh="品牌" data-en="Brand">品牌</label><input id="vfBrand"></div>
    </div>
    <div class="row2">
      <div><label data-zh="樓層代號" data-en="Floor code">樓層代號</label><input id="vfFloor"></div>
      <div>
        <label data-zh="狀態" data-en="Status">狀態</label>
        <select id="vfStatus">
          <option value="正常" data-zh="正常" data-en="OK">正常</option>
          <option value="維修中" data-zh="維修中" data-en="Repairing">維修中</option>
          <option value="報廢" data-zh="報廢" data-en="Scrapped">報廢</option>
        </select>
      </div>
    </div>

    <label data-zh="圖片" data-en="Image">圖片</label>

var SUPABASE_URL = "https://qxgntqtzaefapjyxaqhs.supabase.co";

// ---- state ----
var isAdmin = false;

// ============================================================================

async function loadAll() {
  var cats = await sb.from("categories").select("*").order("sort_order");

  if (cats.error || prods.error) {

      "</div>";
    console.error(cats.error || prods.error);
    return;
  }

  vacMaint = m.error ? [] : (m.data || []);

}

// ============================================================================
//  Helpers
// ============================================================================
function esc(s) {
  return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function slug(cat) { return "cat-" + cat.id; }
function stateText(status, lang) { return status === "停用" ? (lang === "zh" ? "已停用" : "Disabled") : (lang === "zh" ? "上架中" : "Live"); }
function toggleText(status, lang) {
  return status === "停用" ? (lang === "zh" ? "▶ 啟用" : "▶ Enable") : (lang === "zh" ? "■ 停用" : "■ Disable");
}
function vacStatusText(st, lang) {
  if (lang === "en") return st === "維修中" ? "Repairing" : st === "報廢" ? "Scrapped" : "OK";
  return st;
}
function emptyState(ico, zh, en) {
  return '<div class="empty-state"><span class="ico">' + ico + '</span><div data-zh="' + esc(zh) + '" data-en="' + esc(en) + '">' + esc(zh) + "</div></div>";
}

// ============================================================================
//  Render dispatch
// ============================================================================
function render() {
  document.querySelectorAll(".module-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-m") === currentModule);
  });
  var lab = MODULE_ADD_LABEL[currentModule];
  var labEl = document.getElementById("addFabLabel");
  labEl.setAttribute("data-zh", lab.zh);
  labEl.setAttribute("data-en", lab.en);
  document.getElementById("addFab").style.display = isAdmin ? "block" : "none";

  var html = "";
  if (currentModule === "cleaning") html = renderCleaning();
  else if (currentModule === "vacuum") html = renderVacuum();
  else html = renderTool();
  document.getElementById("container").innerHTML = html;

  applyLang();
}
function setModule(m) { currentModule = m; render(); }

function applyLang() {
  var lang = currentLang;
  document.getElementById("btnZh").className = "lang-btn" + (lang === "zh" ? " active" : "");
  document.getElementById("btnEn").className = "lang-btn" + (lang === "en" ? " active" : "");
  document.querySelectorAll("[data-" + lang + "]").forEach(function (el) {
    var val = el.getAttribute("data-" + lang);
    if (val !== null && el.children.length === 0) el.textContent = val;
  });
  document.querySelectorAll("[data-" + lang + "-placeholder]").forEach(function (el) {
    el.placeholder = el.getAttribute("data-" + lang + "-placeholder");
  });
}
function setLang(lang) { currentLang = lang; render(); }

// ============================================================================
//  Module 1 — Cleaning chemicals
// ============================================================================
function renderCleaning() {
  if (!products.length) return emptyState("🧴", "尚無清潔劑資料", "No chemicals yet");
  var nav = '<nav class="nav-bar">';
  categories.forEach(function (c) {
    var count = products.filter(function (p) { return p.category_id === c.id; }).length;
    nav += '<a href="#' + slug(c) + '" class="nav-item" style="--cat-color:' + esc(c.color) + '">' +
      esc(c.icon) + ' <span data-zh="' + esc(c.name_zh) + '" data-en="' + esc(c.name_en) + '">' + esc(c.name_zh) +
      '</span> <span class="nav-count">' + count + "</span></a>";
  });
  nav += "</nav>";

  var body = "";
  categories.forEach(function (c) {
    var items = products.filter(function (p) { return p.category_id === c.id; });
    if (!items.length) return;
    var typeWord = currentLang === "zh" ? " 種" : " types";
    body += '<section id="' + slug(c) + '" class="category-section">' +
      '<div class="category-header" style="border-left:5px solid ' + esc(c.color) + ";background:" + esc(c.bg) + '">' +
      '<div class="cat-title"><span class="cat-icon">' + esc(c.icon) + "</span><div>" +
      '<h2 data-zh="' + esc(c.name_zh) + '" data-en="' + esc(c.name_en) + '">' + esc(c.name_zh) + "</h2>" +
      '<span class="cat-subtitle">' + esc(c.name_en) + " — " + items.length + typeWord + "</span></div></div></div>" +
      '<div class="products-grid">' + items.map(cleaningCard).join("") + "</div></section>";
  });
  return nav + body;
}

function cleaningCard(p) {
  var s = Number(p.stock);
  var stockClass = s > 5 ? "stock-ok" : s > 0 ? "stock-low" : "stock-out";
  var disabled = p.status === "停用";
  var rinseYes = p.rinse_zh === "需要";
  var img = p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.alt || p.name_zh) + '" loading="lazy">' : '<span class="no-img">🧴</span>';
  var admin = isAdmin ? (
    '<div class="stock-edit" style="display:flex">' +
      '<button class="adj-btn" onclick="adjustStock(' + p.id + ',-1)">-</button>' +
      '<input type="number" class="stock-input" id="input-' + p.id + '" min="0" value="' + s + '">' +
      '<button class="adj-btn" onclick="adjustStock(' + p.id + ',1)">+</button>' +
      '<button class="save-btn" id="savebtn-' + p.id + '" onclick="saveStock(' + p.id + ')" data-zh="儲存" data-en="Save">儲存</button>' +
    "</div>" +
    '<div class="status-row" style="display:flex">' +
      '<span class="state-pill ' + (disabled ? "state-off" : "state-on") + '">' + stateText(p.status, currentLang) + "</span>" +
      '<button class="toggle-btn ' + (disabled ? "enable" : "disable") + '" onclick="toggleStatus(' + p.id + ')">' + toggleText(p.status, currentLang) + "</button>" +
      '<button class="edit-btn" onclick="openProductForm(' + p.id + ')" data-zh="編輯" data-en="Edit">編輯</button>' +
      '<button class="del-btn" onclick="deleteProduct(' + p.id + ')" data-zh="刪除" data-en="Delete">刪除</button>' +
    "</div>"
  ) : "";
  return '<div class="product-card' + (disabled ? " disabled" : "") + '" data-id="' + p.id + '">' +
    '<div class="disabled-badge" data-zh="已停用" data-en="Disabled">已停用</div>' +
    '<div class="product-img">' + img + "</div>" +
    '<div class="product-info"><div class="info-top"><div>' +
      '<div class="product-name" data-zh="' + esc(p.name_zh) + '" data-en="' + esc(p.name_en) + '">' + esc(p.name_zh) + "</div>" +
      '<div class="product-name-sub" data-zh="' + esc(p.subname_zh) + '" data-en="' + esc(p.subname_en) + '">' + esc(p.subname_zh) + "</div>" +
    "</div>" +
    '<div class="stock-area"><div class="stock-badge ' + stockClass + '" id="stock-' + p.id + '">' + s + "</div>" +
    '<div class="stock-label" data-zh="庫存" data-en="Stock">庫存</div></div></div>' +
    '<table class="detail-table">' +
      '<tr><td class="dt-label" data-zh="適用範圍" data-en="Applicable">適用範圍</td><td class="dt-value" data-zh="' + esc(p.applicable_zh) + '" data-en="' + esc(p.applicable_en) + '">' + esc(p.applicable_zh) + "</td></tr>" +
      '<tr><td class="dt-label" data-zh="兌水比例" data-en="Dilution">兌水比例</td><td class="dt-value" data-zh="' + esc(p.dilution_zh) + '" data-en="' + esc(p.dilution_en) + '">' + esc(p.dilution_zh) + "</td></tr>" +
      '<tr><td class="dt-label" data-zh="需要過水" data-en="Rinse">需要過水</td><td class="dt-value"><span class="' + (rinseYes ? "rinse-yes" : "rinse-no") + '" data-zh="' + esc(p.rinse_zh) + '" data-en="' + esc(p.rinse_en) + '">' + esc(p.rinse_zh) + "</span></td></tr>" +
    "</table>" + admin +
    "</div></div>";
}

function adjustStock(id, delta) {
  var inp = document.getElementById("input-" + id);
  var val = Number(inp.value) + delta; if (val < 0) val = 0; inp.value = val;
}
async function saveStock(id) {
  var inp = document.getElementById("input-" + id);
  var btn = document.getElementById("savebtn-" + id);
  var n = Number(inp.value);
  btn.textContent = "..."; btn.className = "save-btn saving";
  var res = await sb.rpc("update_stock", { p_password: currentPwd, p_id: id, p_stock: n });
  if (!res.error) {
    btn.textContent = "OK!"; btn.className = "save-btn saved";
    replaceLocal(products, res.data);
    var b = document.getElementById("stock-" + id);
    b.textContent = n; b.className = "stock-badge " + (n > 5 ? "stock-ok" : n > 0 ? "stock-low" : "stock-out");
  } else {
    btn.textContent = currentLang === "zh" ? "失敗" : "Failed"; btn.className = "save-btn error"; adminErr(res.error);
  }
  setTimeout(function () { btn.textContent = currentLang === "zh" ? "儲存" : "Save"; btn.className = "save-btn"; }, 1500);
}
async function toggleStatus(id) {
  var p = products.find(function (x) { return x.id === id; });
  var next = p.status === "停用" ? "啟用" : "停用";
  var res = await sb.rpc("update_status", { p_password: currentPwd, p_id: id, p_status: next });
  if (!res.error) { replaceLocal(products, res.data); render(); } else adminErr(res.error);
}

// ---- cleaning product form ----
function openProductForm(id) {
  editProductId = (id == null ? null : id);
  fillCategorySelect();
  document.getElementById("pfError").style.display = "none";
  document.getElementById("pfImgFile").value = "";
  var title = document.getElementById("pmTitle");
  if (editProductId == null) {
    title.setAttribute("data-zh", "新增產品"); title.setAttribute("data-en", "Add product");
    setProductForm({ category_id: categories[0] && categories[0].id, stock: 0, rinse_zh: "不需要" });
  } else {
    title.setAttribute("data-zh", "編輯產品"); title.setAttribute("data-en", "Edit product");
    setProductForm(products.find(function (x) { return x.id === editProductId; }));
  }
  document.getElementById("productModal").classList.add("show");
  applyLang();
}
function closeProductForm() { document.getElementById("productModal").classList.remove("show"); }
function fillCategorySelect() {
  document.getElementById("pfCategory").innerHTML = categories.map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.icon + " " + c.name_zh) + "</option>";
  }).join("");
}
function setProductForm(p) {
  p = p || {};
  document.getElementById("pfCategory").value = p.category_id || (categories[0] && categories[0].id) || "";
  document.getElementById("pfNameZh").value = p.name_zh || "";
  document.getElementById("pfNameEn").value = p.name_en || "";
  document.getElementById("pfAppZh").value = p.applicable_zh || "";
  document.getElementById("pfAppEn").value = p.applicable_en || "";
  document.getElementById("pfDilZh").value = p.dilution_zh || "";
  document.getElementById("pfDilEn").value = p.dilution_en || "";
  document.getElementById("pfRinse").value = p.rinse_zh === "需要" ? "yes" : "no";
  document.getElementById("pfStock").value = p.stock != null ? p.stock : 0;
  formImages.pf = p.image || null;
  document.getElementById("pfImgPreview").innerHTML = formImages.pf ? '<img src="' + esc(formImages.pf) + '">' : '<span class="no-img">🧴</span>';
}
async function saveProductForm() {
  var btn = document.getElementById("pfSaveBtn");
  var errEl = document.getElementById("pfError");
  errEl.style.display = "none";
  var nameZh = document.getElementById("pfNameZh").value.trim();
  if (!nameZh) { errEl.textContent = currentLang === "zh" ? "請填寫中文名稱" : "Name (ZH) required"; errEl.style.display = "block"; return; }
  var rinseYes = document.getElementById("pfRinse").value === "yes";
  var payload = {
    category_id: document.getElementById("pfCategory").value,
    name_zh: nameZh,
    name_en: document.getElementById("pfNameEn").value.trim(),
    subname_zh: document.getElementById("pfNameEn").value.trim(),
    subname_en: nameZh,
    applicable_zh: document.getElementById("pfAppZh").value.trim(),
    applicable_en: document.getElementById("pfAppEn").value.trim(),
    dilution_zh: document.getElementById("pfDilZh").value.trim(),
    dilution_en: document.getElementById("pfDilEn").value.trim(),
    rinse_zh: rinseYes ? "需要" : "不需要",
    rinse_en: rinseYes ? "Required" : "Not required",
    image: formImages.pf,
    alt: nameZh,
    stock: document.getElementById("pfStock").value,
    status: "啟用",
    sort_order: editProductId || 999,
  };
  if (editProductId != null) payload.id = editProductId;
  btn.textContent = "..."; btn.disabled = true;
  var res = await sb.rpc("upsert_product", { p_password: currentPwd, p_product: payload });
  btn.textContent = currentLang === "zh" ? "儲存" : "Save"; btn.disabled = false;
  if (!res.error) { upsertLocal(products, res.data); closeProductForm(); render(); }
  else { errEl.textContent = friendlyError(res.error); errEl.style.display = "block"; }
}
async function deleteProduct(id) {
  var p = products.find(function (x) { return x.id === id; });
  if (!confirm((currentLang === "zh" ? "確定刪除「" : 'Delete "') + (p ? p.name_zh : id) + (currentLang === "zh" ? "」？此操作無法復原。" : '"?'))) return;
  var res = await sb.rpc("delete_product", { p_password: currentPwd, p_id: id });
  if (!res.error) { products = products.filter(function (x) { return x.id !== id; }); render(); } else adminErr(res.error);
}

//  Module 2 — Vacuums
// ============================================================================
function renderVacuum() {
  if (!vacuums.length) return emptyState("🌀", "尚無吸塵機，登入後可新增", "No vacuums yet");
  var groups = {};
  vacuums.forEach(function (v) {
    var f = v.floor_code && v.floor_code.trim() ? v.floor_code : (currentLang === "zh" ? "未指定樓層" : "No floor");
    (groups[f] = groups[f] || []).push(v);
  });
  var floors = Object.keys(groups).sort();
  var repairing = vacuums.filter(function (v) { return v.status === "維修中"; }).length;
  var summary = '<div class="cat-subtitle" style="padding:0 4px 14px">' +
    (currentLang === "zh"
      ? "共 " + vacuums.length + " 台" + (repairing ? "，維修中 " + repairing + " 台" : "")
      : vacuums.length + " units" + (repairing ? ", " + repairing + " repairing" : "")) + "</div>";
  var html = summary;
  floors.forEach(function (f) {
    html += '<section class="category-section">' +
      '<div class="category-header" style="border-left:5px solid #2E86C1;background:#EBF5FB">' +
      '<div class="cat-title"><span class="cat-icon">🏢</span><div><h2>' + esc(f) + "</h2>" +
      '<span class="cat-subtitle">' + groups[f].length + (currentLang === "zh" ? " 台" : " units") + "</span></div></div></div>" +
      '<div class="vac-grid">' + groups[f].map(vacCard).join("") + "</div></section>";
  });
  return html;
}
function vacCard(v) {
  var img = v.image ? '<img src="' + esc(v.image) + '">' : '<span class="no-img">🌀</span>';
  var st = v.status;
  var stCls = st === "維修中" ? "vs-repair" : st === "報廢" ? "vs-scrap" : "vs-ok";
  var records = vacMaint.filter(function (m) { return m.vacuum_id === v.id; });
  var maintList = records.length
    ? records.map(function (m) {
        return '<div class="maint-item"><span>' + esc(m.description) +
          (isAdmin ? ' <button class="maint-del" onclick="deleteMaint(' + m.id + ')">✕</button>' : "") +
          '</span><span class="maint-date">' + esc(m.service_date) + "</span></div>";
      }).join("")
    : '<div class="maint-empty" data-zh="尚無保養記錄" data-en="No records yet">尚無保養記錄</div>';
  var admin = isAdmin ? (
    '<div class="vac-actions">' +
      '<button class="mini-btn warn" onclick="toggleVacuumStatus(' + v.id + ')" data-zh="切換狀態" data-en="Toggle">切換狀態</button>' +
      '<button class="mini-btn" onclick="openMaintForm(' + v.id + ')" data-zh="＋ 保養" data-en="+ Maint">＋ 保養</button>' +
      '<button class="mini-btn" onclick="openVacuumForm(' + v.id + ')" data-zh="編輯" data-en="Edit">編輯</button>' +
      '<button class="mini-btn grey" onclick="deleteVacuum(' + v.id + ')" data-zh="刪除" data-en="Delete">刪除</button>' +
    "</div>"
  ) : "";
  return '<div class="vac-card ' + (st === "報廢" ? "scrap" : "") + '">' +
    '<div class="vac-top"><div class="vac-img">' + img + "</div>" +
    '<div class="vac-head"><div class="vac-model">' + esc(v.model) + "</div>" +
    (v.brand ? '<div class="vac-brand">' + esc(v.brand) + "</div>" : "") +
    '<div class="vac-badges">' +
      (v.floor_code ? '<span class="floor-badge">' + esc(v.floor_code) + "</span>" : "") +
      '<span class="vac-status ' + stCls + '">' + esc(vacStatusText(st, currentLang)) + "</span>" +
    "</div></div></div>" +
    (v.notes ? '<div class="vac-notes">' + esc(v.notes) + "</div>" : "") +
    '<div class="maint-box"><div class="maint-title" data-zh="🛠 保養記錄" data-en="🛠 Maintenance">🛠 保養記錄</div>' + maintList + "</div>" +
    admin + "</div>";
}
async function toggleVacuumStatus(id) {
  var v = vacuums.find(function (x) { return x.id === id; });
  var next = v.status === "正常" ? "維修中" : "正常";
  var res = await sb.rpc("update_vacuum_status", { p_password: currentPwd, p_id: id, p_status: next });
  if (!res.error) { replaceLocal(vacuums, res.data); render(); } else adminErr(res.error);
}
function openVacuumForm(id) {
  editVacuumId = (id == null ? null : id);
  document.getElementById("vfError").style.display = "none";
  document.getElementById("vfImgFile").value = "";
  var title = document.getElementById("vmTitle");

  title.setAttribute("data-en", editVacuumId == null ? "Add vacuum" : "Edit vacuum");
  document.getElementById("vfModel").value = v.model || "";
  document.getElementById("vfBrand").value = v.brand || "";
  document.getElementById("vfFloor").value = v.floor_code || "";
  document.getElementById("vfStatus").value = v.status || "正常";
  document.getElementById("vfNotes").value = v.notes || "";

  document.getElementById("vfImgPreview").innerHTML = formImages.vf ? '<img src="' + esc(formImages.vf) + '">' : '<span class="no-img">🌀</span>';

}
function closeVacuumForm() { document.getElementById("vacuumModal").classList.remove("show"); }
async function saveVacuumForm() {
  var btn = document.getElementById("vfSaveBtn");
  var errEl = document.getElementById("vfError");
  errEl.style.display = "none";
  var model = document.getElementById("vfModel").value.trim();
  if (!model) { errEl.textContent = currentLang === "zh" ? "請填寫型號" : "Model required"; errEl.style.display = "block"; return; }
  var payload = {
    model: model,
    brand: document.getElementById("vfBrand").value.trim(),
    floor_code: document.getElementById("vfFloor").value.trim(),
    status: document.getElementById("vfStatus").value,
    notes: document.getElementById("vfNotes").value.trim(),
    image: formImages.vf,
  };
  if (editVacuumId != null) payload.id = editVacuumId;
  btn.textContent = "..."; btn.disabled = true;
  var res = await sb.rpc("upsert_vacuum", { p_password: currentPwd, p_vacuum: payload });
  btn.textContent = currentLang === "zh" ? "儲存" : "Save"; btn.disabled = false;
  if (!res.error) { upsertLocal(vacuums, res.data); closeVacuumForm(); render(); }
  else { errEl.textContent = friendlyError(res.error); errEl.style.display = "block"; }
}
async function deleteVacuum(id) {
  var v = vacuums.find(function (x) { return x.id === id; });
  if (!confirm((currentLang === "zh" ? "確定刪除吸塵機「" : 'Delete vacuum "') + (v ? v.model : id) + (currentLang === "zh" ? "」？保養記錄也會一併刪除。" : '"? Maintenance records will also be deleted.'))) return;
  var res = await sb.rpc("delete_vacuum", { p_password: currentPwd, p_id: id });
  if (!res.error) {
    vacuums = vacuums.filter(function (x) { return x.id !== id; });
    vacMaint = vacMaint.filter(function (m) { return m.vacuum_id !== id; });
    render();
  } else adminErr(res.error);
}

// ---- maintenance ----

}
function closeMaintForm() { document.getElementById("maintModal").classList.remove("show"); }
async function saveMaintForm() {
  var btn = document.getElementById("mfSaveBtn");
  var errEl = document.getElementById("mfError");
  errEl.style.display = "none";
  var desc = document.getElementById("mfDesc").value.trim();

  var res = await sb.rpc("add_vacuum_maintenance", {

async function deleteMaint(id) {

// ============================================================================
//  Module 3 — Tools (inventory)
// ============================================================================
function renderTool() {
  if (!tools.length) return emptyState("🧹", "尚無清潔工具，登入後可新增", "No tools yet");
  return '<section class="category-section"><div class="products-grid">' + tools.map(toolCard).join("") + "</div></section>";
}
function toolCard(t) {
  var s = Number(t.stock);
  var stockClass = s > 5 ? "stock-ok" : s > 0 ? "stock-low" : "stock-out";
  var disabled = t.status === "停用";
  var img = t.image ? '<img src="' + esc(t.image) + '" loading="lazy">' : '<span class="no-img">🧹</span>';
  var admin = isAdmin ? (
    '<div class="stock-edit" style="display:flex">' +
      '<button class="adj-btn" onclick="adjustToolStock(' + t.id + ',-1)">-</button>' +
      '<input type="number" class="stock-input" id="tinput-' + t.id + '" min="0" value="' + s + '">' +
      '<button class="adj-btn" onclick="adjustToolStock(' + t.id + ',1)">+</button>' +
      '<button class="save-btn" id="tsave-' + t.id + '" onclick="saveToolStock(' + t.id + ')" data-zh="儲存" data-en="Save">儲存</button>' +
    "</div>" +
    '<div class="status-row" style="display:flex">' +
      '<span class="state-pill ' + (disabled ? "state-off" : "state-on") + '">' + stateText(t.status, currentLang) + "</span>" +
      '<button class="toggle-btn ' + (disabled ? "enable" : "disable") + '" onclick="toggleToolStatus(' + t.id + ')">' + toggleText(t.status, currentLang) + "</button>" +
      '<button class="edit-btn" onclick="openToolForm(' + t.id + ')" data-zh="編輯" data-en="Edit">編輯</button>' +
      '<button class="del-btn" onclick="deleteTool(' + t.id + ')" data-zh="刪除" data-en="Delete">刪除</button>' +
    "</div>"
  ) : "";
  return '<div class="product-card' + (disabled ? " disabled" : "") + '">' +
    '<div class="disabled-badge" data-zh="已停用" data-en="Disabled">已停用</div>' +
    '<div class="product-img">' + img + "</div>" +
    '<div class="product-info"><div class="info-top"><div>' +
      '<div class="product-name">' + esc(t.name) + "</div>" +
      (t.notes ? '<div class="product-name-sub">' + esc(t.notes) + "</div>" : "") +
    "</div>" +
    '<div class="stock-area"><div class="stock-badge ' + stockClass + '">' + s + "</div>" +
    '<div class="stock-label" data-zh="數量" data-en="Qty">數量</div></div></div>' + admin +
    "</div></div>";
}
function adjustToolStock(id, delta) {
  var inp = document.getElementById("tinput-" + id);
  var val = Number(inp.value) + delta; if (val < 0) val = 0; inp.value = val;
}
async function saveToolStock(id) {
  var inp = document.getElementById("tinput-" + id);
  var btn = document.getElementById("tsave-" + id);
  var n = Number(inp.value);
  btn.textContent = "..."; btn.className = "save-btn saving";
  var res = await sb.rpc("update_tool_stock", { p_password: currentPwd, p_id: id, p_stock: n });
  if (!res.error) { btn.textContent = "OK!"; btn.className = "save-btn saved"; replaceLocal(tools, res.data); }
  else { btn.textContent = currentLang === "zh" ? "失敗" : "Failed"; btn.className = "save-btn error"; adminErr(res.error); }
  setTimeout(function () { btn.textContent = currentLang === "zh" ? "儲存" : "Save"; btn.className = "save-btn"; }, 1500);
}
async function toggleToolStatus(id) {
  var t = tools.find(function (x) { return x.id === id; });
  var next = t.status === "停用" ? "啟用" : "停用";
  var res = await sb.rpc("update_tool_status", { p_password: currentPwd, p_id: id, p_status: next });
  if (!res.error) { replaceLocal(tools, res.data); render(); } else adminErr(res.error);
}
function openToolForm(id) {
  editToolId = (id == null ? null : id);
  document.getElementById("tfError").style.display = "none";
  document.getElementById("tfImgFile").value = "";
  var title = document.getElementById("tmTitle");
  var t = editToolId == null ? { stock: 0 } : tools.find(function (x) { return x.id === editToolId; });
  title.setAttribute("data-zh", editToolId == null ? "新增工具" : "編輯工具");
  title.setAttribute("data-en", editToolId == null ? "Add tool" : "Edit tool");
  document.getElementById("tfName").value = t.name || "";
  document.getElementById("tfStock").value = t.stock != null ? t.stock : 0;
  document.getElementById("tfNotes").value = t.notes || "";
  formImages.tf = t.image || null;
  document.getElementById("tfImgPreview").innerHTML = formImages.tf ? '<img src="' + esc(formImages.tf) + '">' : '<span class="no-img">🧹</span>';
  document.getElementById("toolModal").classList.add("show");
  applyLang();
}
function closeToolForm() { document.getElementById("toolModal").classList.remove("show"); }
async function saveToolForm() {
  var btn = document.getElementById("tfSaveBtn");
  var errEl = document.getElementById("tfError");
  errEl.style.display = "none";
  var name = document.getElementById("tfName").value.trim();
  if (!name) { errEl.textContent = currentLang === "zh" ? "請填寫名稱" : "Name required"; errEl.style.display = "block"; return; }
  var payload = {
    name: name,
    stock: document.getElementById("tfStock").value,
    notes: document.getElementById("tfNotes").value.trim(),
    image: formImages.tf,
    status: "啟用",
  };
  if (editToolId != null) payload.id = editToolId;
  btn.textContent = "..."; btn.disabled = true;
  var res = await sb.rpc("upsert_tool", { p_password: currentPwd, p_tool: payload });
  btn.textContent = currentLang === "zh" ? "儲存" : "Save"; btn.disabled = false;
  if (!res.error) { upsertLocal(tools, res.data); closeToolForm(); render(); }
  else { errEl.textContent = friendlyError(res.error); errEl.style.display = "block"; }
}
async function deleteTool(id) {
  var t = tools.find(function (x) { return x.id === id; });
  if (!confirm((currentLang === "zh" ? "確定刪除工具「" : 'Delete tool "') + (t ? t.name : id) + (currentLang === "zh" ? "」？" : '"?'))) return;
  var res = await sb.rpc("delete_tool", { p_password: currentPwd, p_id: id });
  if (!res.error) { tools = tools.filter(function (x) { return x.id !== id; }); render(); } else adminErr(res.error);
}

// ============================================================================
//  Admin session
// ============================================================================
function openAddForModule() {
  if (currentModule === "cleaning") openProductForm();
  else if (currentModule === "vacuum") openVacuumForm();
  else openToolForm();
}
function toggleAdmin() { if (isAdmin) { logout(); return; } openLogin(); }
function openLogin() {
  document.getElementById("loginModal").classList.add("show");
  document.getElementById("pwdInput").value = "";
  var e = document.getElementById("modalError");
  e.textContent = currentLang === "zh" ? "密碼錯誤，請重試" : "Wrong password, please try again";
  e.style.display = "none";
  setTimeout(function () { document.getElementById("pwdInput").focus(); }, 100);
}
function closeModal() { document.getElementById("loginModal").classList.remove("show"); }
async function doLogin() {
  var pwd = document.getElementById("pwdInput").value;
  if (!pwd) return;
  var loginBtn = document.querySelector("#loginModal .btn-login");
  var errEl = document.getElementById("modalError");
  loginBtn.textContent = "..."; loginBtn.disabled = true; errEl.style.display = "none";
  var res = await sb.rpc("verify_password", { p_password: pwd });
  loginBtn.textContent = currentLang === "zh" ? "登入" : "Login"; loginBtn.disabled = false;
  if (!res.error && res.data === true) {
    currentPwd = pwd; isAdmin = true;
    closeModal();
    var fab = document.getElementById("adminFab");
    fab.className = "admin-fab unlocked";
    fab.querySelector("span").setAttribute("data-zh", "🔓 已登入");
    fab.querySelector("span").setAttribute("data-en", "🔓 Logged in");
    document.getElementById("statusBar").classList.add("show");
    render();
  } else if (res.error) {
    errEl.textContent = currentLang === "zh" ? "無法連接伺服器" : "Cannot connect to server"; errEl.style.display = "block";
  } else {
    errEl.textContent = currentLang === "zh" ? "密碼錯誤，請重試" : "Wrong password, please try again"; errEl.style.display = "block";
  }
}
function logout() {
  isAdmin = false; currentPwd = "";
  var fab = document.getElementById("adminFab");
  fab.className = "admin-fab locked";
  fab.querySelector("span").setAttribute("data-zh", "🔒 管理員");
  fab.querySelector("span").setAttribute("data-en", "🔒 Admin");
  document.getElementById("statusBar").classList.remove("show");
  render();
}

// ============================================================================
//  Local cache helpers + errors
// ============================================================================
function replaceLocal(arr, row) {
  if (!row) return;
  var i = arr.findIndex(function (x) { return x.id === row.id; });
  if (i >= 0) arr[i] = row;
}
function upsertLocal(arr, row) {
  if (!row) return;
  var i = arr.findIndex(function (x) { return x.id === row.id; });
  if (i >= 0) arr[i] = row; else arr.push(row);
}
function friendlyError(err) {
  var msg = (err && err.message) || "";
  if (/wrong password/i.test(msg)) return currentLang === "zh" ? "密碼錯誤" : "Wrong password";
  if (/not configured/i.test(msg)) return currentLang === "zh" ? "尚未設定密碼" : "Password not set";
  return currentLang === "zh" ? "操作失敗：" + msg : "Failed: " + msg;
}
function adminErr(err) {
  if (/wrong password/i.test((err && err.message) || "")) {
    logout(); openLogin();
    document.getElementById("modalError").textContent = currentLang === "zh" ? "密碼已失效，請重新登入" : "Session expired, please log in again";
    document.getElementById("modalError").style.display = "block";
  } else {
    alert(friendlyError(err));
  }
}
