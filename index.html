<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店後勤系統 Hotel Back-of-House</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   酒店後勤系統 — unified design system
   ============================================================ */
:root {
  --bg:#eaeef2; --surface:#ffffff; --surface-2:#f5f8fa; --surface-3:#eef2f6;
  --ink:#1d2a35; --ink-2:#566675; --ink-3:#8a99a8; --line:#e4eaef; --line-2:#eef2f6;
  --brand-1:#0e2a33; --brand-2:#1c4a56; --brand-3:#2b7280; --accent:#1f6f7c;
  --ok:#1c8b4b; --ok-bg:#e6f6ec; --warn:#c1650f; --warn-bg:#fdeed7;
  --danger:#cf463c; --danger-bg:#fbe9e7; --info:#2c72c6; --info-bg:#e9f1fb;
  --gold:#b8842b;
  --r:16px; --r-md:12px; --r-sm:9px; --pill:999px;
  --sh:0 1px 2px rgba(20,35,48,.04), 0 6px 18px rgba(20,35,48,.06);
  --sh-hi:0 10px 30px rgba(20,35,48,.12);
  --pad:16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter','Noto Sans TC',sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
::selection { background:#bfe3e8; }

/* ---------- Header ---------- */
.page-header { background:linear-gradient(140deg,var(--brand-1) 0%,var(--brand-2) 55%,var(--brand-3) 100%); color:#fff; padding:26px 22px 22px; text-align:center; position:relative; z-index:140; }
.page-header h1 { font-size:33px; font-weight:800; letter-spacing:.5px; }
.page-header .sub { font-size:15px; opacity:.68; margin-top:6px; letter-spacing:1px; }
/* Settings gear + dropdown (top-right) */
.settings { position:absolute; top:16px; right:18px; z-index:200; }
.gear-btn { width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,.32); background:rgba(255,255,255,.15); color:#fff; font-size:19px; cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:center; }
.gear-btn:hover { background:rgba(255,255,255,.28); transform:rotate(30deg); }
.settings-menu { display:none; position:fixed; top:62px; right:16px; z-index:260; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--sh-hi); padding:12px; width:216px; text-align:left; }
.settings-menu.show { display:block; }
.set-item { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:11px 12px; border:none; background:transparent; border-radius:10px; font-family:inherit; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; }
.set-item:hover { background:var(--surface-2); }
.set-item.on { color:var(--ok); }
.set-cur { margin-left:auto; font-size:13px; font-weight:600; color:var(--ink-3); }
.set-caret { color:var(--ink-3); font-size:16px; transition:.2s; }
.set-item[aria-expanded="true"] .set-caret { transform:rotate(90deg); }
.set-sub { display:none; padding:4px 8px 8px; }
.set-sub.show { display:block; }
.lang-toggle { display:flex; border-radius:var(--pill); overflow:hidden; background:var(--surface-2); padding:3px; }
.lang-btn { flex:1; padding:8px 12px; font-size:14px; font-weight:700; cursor:pointer; border:none; background:transparent; color:var(--ink-3); font-family:inherit; border-radius:var(--pill); transition:.2s; }
.lang-btn.active { background:var(--brand-2); color:#fff; }

/* ---------- Module tab bar (sticky) ---------- */
.module-bar { background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); display:flex; justify-content:center; gap:6px; padding:10px 12px; position:sticky; top:0; z-index:110; box-shadow:0 1px 0 rgba(20,35,48,.03); flex-wrap:wrap; }
.module-btn { padding:8px 20px; border-radius:var(--pill); border:1px solid var(--line); background:var(--surface); font-weight:700; cursor:pointer; font-family:inherit; font-size:16.5px; display:flex; align-items:center; gap:8px; color:var(--ink-2); transition:.18s; }
.module-btn:hover { border-color:var(--accent); color:var(--accent); }
.module-btn.active { background:linear-gradient(135deg,var(--brand-2),var(--brand-3)); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(28,74,86,.28); }

/* ---------- Search ---------- */
.search-bar { background:var(--surface); padding:10px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:center; }
.search-wrap { position:relative; width:100%; max-width:540px; }
.search-bar input { width:100%; padding:10px 40px 10px 16px; border:1px solid var(--line); border-radius:var(--pill); font-size:14px; font-family:inherit; background:var(--surface-2); transition:.2s; }
.search-bar input:focus { outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(31,111,124,.12); }
.search-clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:var(--surface-3); color:var(--ink-3); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:13px; line-height:1; }
.search-clear:hover { background:#e0e6ec; color:var(--ink-2); }

/* ---------- Status bar ---------- */
.status-bar { display:none; background:linear-gradient(90deg,var(--ok),#1aa055); color:#fff; text-align:center; padding:9px; font-size:13px; font-weight:600; letter-spacing:.3px; }
.status-bar.show { display:block; }

/* ---------- Layout ---------- */
.container { max-width:1120px; margin:0 auto; padding:22px 18px 90px; }
.category-section { margin-bottom:34px; }

/* Category / group headers — colored left accent comes from inline style */
.category-header { padding:14px 18px; border-radius:var(--r-md); margin-bottom:16px; background:var(--surface) !important; box-shadow:var(--sh); border:1px solid var(--line); border-left-width:5px; }
.cat-title { display:flex; align-items:center; gap:12px; }
.cat-icon { font-size:24px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border-radius:12px; flex:0 0 auto; }
.cat-title h2 { font-size:18px; font-weight:800; margin-bottom:1px; color:var(--ink); }
.cat-subtitle { font-size:12px; color:var(--ink-3); font-weight:600; }
.summary-line { padding:12px 4px 4px; font-size:13.5px; color:var(--ink-2); font-weight:700; }
.disabled-head { border-left-color:#a9b6c2 !important; }

/* ---------- Nav pills (cleaning categories) ---------- */
.nav-bar { display:flex; gap:8px; flex-wrap:wrap; padding:6px 2px 16px; }
.nav-item { text-decoration:none; color:var(--ink-2); padding:7px 14px; border-radius:var(--pill); font-size:13px; font-weight:700; transition:.18s; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; gap:6px; box-shadow:0 1px 2px rgba(20,35,48,.03); }
.nav-item:hover { background:var(--cat-color,var(--accent)); color:#fff; border-color:transparent; }
.nav-count { background:var(--surface-3); padding:1px 8px; border-radius:var(--pill); font-size:11px; color:var(--ink-2); }
.nav-item:hover .nav-count { background:rgba(255,255,255,.28); color:#fff; }

/* ---------- Product cards (cleaning + tools) ---------- */
.products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
.product-card { background:var(--surface); border-radius:var(--r); border:1px solid var(--line); overflow:hidden; display:flex; transition:.22s; box-shadow:var(--sh); position:relative; }
.product-card:hover { transform:translateY(-3px); box-shadow:var(--sh-hi); border-color:#d8e0e7; }
.product-img { width:104px; min-height:120px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border-right:1px solid var(--line-2); padding:8px; cursor:zoom-in; }
.product-img img { max-width:100%; max-height:104px; object-fit:contain; border-radius:8px; }
.no-img { font-size:34px; opacity:.22; }
.product-info { flex:1; padding:13px 15px; display:flex; flex-direction:column; }
.info-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
.product-name { font-size:16px; font-weight:700; color:var(--ink); line-height:1.3; }
.product-name-sub { font-size:12.5px; color:var(--ink-3); line-height:1.3; margin-top:2px; }
.product-card.disabled { opacity:.62; }
.product-card.disabled .product-img img { filter:grayscale(100%); }
.disabled-badge { display:none; position:absolute; top:8px; left:8px; background:var(--danger); color:#fff; padding:3px 10px; border-radius:var(--pill); font-size:10px; font-weight:800; z-index:10; letter-spacing:.5px; box-shadow:0 2px 6px rgba(207,70,60,.35); }
.product-card.disabled .disabled-badge { display:block; }

/* stock badge */
.stock-area { text-align:center; flex-shrink:0; }
.stock-badge { display:inline-block; min-width:40px; padding:5px 11px; border-radius:12px; font-size:16px; font-weight:800; text-align:center; transition:.3s; }
.stock-label { font-size:10px; color:var(--ink-3); margin-top:3px; font-weight:600; }
.min-label { font-size:10px; color:var(--ink-3); margin-top:2px; font-weight:700; background:var(--surface-2); border-radius:6px; padding:1px 6px; display:inline-block; }
.min-label.below { color:var(--danger); background:var(--danger-bg); }
.tool-meta { display:flex; gap:7px; font-size:11.5px; color:var(--ink-2); font-weight:700; margin:8px 0 2px; flex-wrap:wrap; }
.tool-meta span { background:var(--surface-2); padding:2px 9px; border-radius:6px; }
.tool-meta span.low { background:var(--danger-bg); color:var(--danger); }
.stock-loading { background:var(--surface-3); color:var(--ink-3); }
.stock-ok { background:var(--ok-bg); color:var(--ok); }
.stock-low { background:var(--warn-bg); color:var(--warn); }
.stock-out { background:var(--danger-bg); color:var(--danger); }
.stock-err { background:var(--surface-3); color:var(--ink-3); font-size:11px; }

/* detail table */
.detail-table { width:100%; border-collapse:collapse; margin-top:auto; }
.detail-table td { padding:3.5px 0; font-size:11.5px; vertical-align:middle; }
.dt-label { color:var(--ink-3); width:66px; font-weight:600; }
.dt-value { color:var(--ink-2); font-weight:600; }
.rinse-yes { background:var(--warn-bg); color:var(--warn); padding:1px 7px; border-radius:6px; font-size:10px; font-weight:700; }
.rinse-no { background:var(--ok-bg); color:var(--ok); padding:1px 7px; border-radius:6px; font-size:10px; font-weight:700; }
.note { margin-top:6px; font-size:10px; color:var(--danger); background:var(--danger-bg); padding:3px 7px; border-radius:6px; }

/* status row / pills / action chips */
.status-row { display:none; margin-top:9px; padding-top:9px; border-top:1px solid var(--line-2); gap:6px; align-items:center; flex-wrap:wrap; }
.state-pill { font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:var(--pill); }
.state-on { background:var(--ok-bg); color:var(--ok); }
.state-off { background:var(--surface-3); color:var(--ink-3); }
.toggle-btn,.edit-btn,.del-btn { padding:4px 10px; border-radius:8px; font-size:10.5px; font-weight:700; cursor:pointer; font-family:inherit; border:1px solid; background:transparent; transition:.15s; }
.toggle-btn.enable { border-color:var(--ok); color:var(--ok); } .toggle-btn.enable:hover{background:var(--ok-bg);}
.toggle-btn.disable { border-color:var(--danger); color:var(--danger); } .toggle-btn.disable:hover{background:var(--danger-bg);}
.edit-btn { border-color:var(--info); color:var(--info); } .edit-btn:hover{background:var(--info-bg);}
.del-btn { border-color:#b3bfca; color:var(--ink-3); } .del-btn:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg);}

/* stock edit */
.stock-edit { display:none; align-items:center; gap:6px; margin-top:9px; padding-top:9px; border-top:1px solid var(--line-2); flex-wrap:wrap; }
.adj-btn { width:30px; height:30px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:17px; font-weight:700; color:var(--ink-2); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s; }
.adj-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.stock-input { width:56px; height:30px; text-align:center; border:1px solid var(--line); border-radius:8px; font-size:14px; font-weight:700; font-family:inherit; }
.stock-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(31,111,124,.12); }
.save-btn { padding:5px 13px; height:30px; border:none; border-radius:8px; background:var(--ok); color:#fff; font-size:12px; font-weight:700; cursor:pointer; transition:.2s; font-family:inherit; }
.save-btn:hover { filter:brightness(.95); } .save-btn.saving{background:var(--ink-3);cursor:wait;} .save-btn.saved{background:#22b563;} .save-btn.error{background:var(--danger);}

/* ---------- Batch / expiry ---------- */
.batch-box { margin-top:9px; padding:9px 11px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--line-2); }
.batch-title { font-size:11px; font-weight:800; color:var(--ink-3); margin-bottom:5px; letter-spacing:.3px; }
.batch-item { display:flex; align-items:center; gap:7px; font-size:12px; padding:3px 0; }
.exp-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.exp-ok{background:var(--ok);} .exp-soon{background:var(--warn);} .exp-past{background:var(--danger);} .exp-none{background:#c3ccd4;}
.batch-exp { color:var(--ink-2); flex:1; font-weight:500; }
.batch-qty { font-weight:800; color:var(--ink); min-width:24px; text-align:right; }
.batch-mini { border:none; background:var(--surface-3); color:var(--ink-3); width:22px; height:22px; border-radius:6px; cursor:pointer; font-size:11px; line-height:1; }
.batch-mini:hover { background:#dbe2e8; } .batch-mini.del:hover { background:var(--danger); color:#fff; }

/* ---------- Report ---------- */
.report-controls { display:flex; gap:8px; justify-content:center; padding:14px 0; flex-wrap:wrap; }
.period-btn { padding:7px 16px; border:1px solid var(--line); background:var(--surface); border-radius:var(--pill); font-weight:700; cursor:pointer; font-family:inherit; font-size:13px; color:var(--ink-2); transition:.18s; }
.period-btn:hover { border-color:var(--accent); color:var(--accent); }
.period-btn.active { background:linear-gradient(135deg,var(--brand-2),var(--brand-3)); color:#fff; border-color:transparent; }
.report-scroll { overflow-x:auto; max-width:100%; border-radius:var(--r-md); box-shadow:var(--sh); border:1px solid var(--line); }
.report-table { width:100%; border-collapse:collapse; font-size:13px; background:var(--surface); }
.report-table th,.report-table td { padding:9px 12px; text-align:right; border-bottom:1px solid var(--line-2); white-space:nowrap; }
.report-table th:first-child,.report-table td:first-child { text-align:left; position:sticky; left:0; background:var(--surface); }
.report-table thead th { background:var(--surface-2); color:var(--ink-2); font-weight:800; position:sticky; top:0; }
.report-table thead th:first-child { z-index:1; background:var(--surface-2); }
.report-table tr.total-row td { font-weight:800; background:var(--surface-2); border-top:2px solid var(--brand-3); }

/* ---------- Empty / loading ---------- */
.empty-state { text-align:center; padding:56px 20px; color:var(--ink-3); }
.empty-state .ico { font-size:46px; opacity:.4; display:block; margin-bottom:12px; }
.loading-hint { text-align:center; padding:64px 20px; color:var(--ink-3); font-size:15px; }
.page-footer { text-align:center; padding:20px; color:var(--ink-3); font-size:12px; }

/* ---------- Vacuum / Equipment cards ---------- */
.vac-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
.vac-card { background:var(--surface); border-radius:var(--r); border:1px solid var(--line); overflow:hidden; box-shadow:var(--sh); transition:.22s; display:flex; }
.vac-card:hover { transform:translateY(-3px); box-shadow:var(--sh-hi); border-color:#d8e0e7; }
.vac-card.scrap { opacity:.6; }
.vac-img { width:104px; min-height:120px; flex:0 0 auto; align-self:stretch; background:var(--surface-2); border-right:1px solid var(--line-2); display:flex; align-items:center; justify-content:center; overflow:hidden; padding:8px; cursor:zoom-in; }
.vac-img img { max-width:100%; max-height:104px; object-fit:contain; border-radius:6px; }
.vac-img .no-img { font-size:32px; }
.vac-body { flex:1; min-width:0; display:flex; flex-direction:column; }
.vac-head { padding:13px 15px 4px; }
.vac-model { font-size:16px; font-weight:800; color:var(--ink); line-height:1.25; word-break:break-word; }
.vac-brand { font-size:12.5px; color:var(--ink-3); margin-top:2px; font-weight:500; }
.vac-badges { margin-top:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.floor-badge { display:inline-block; background:var(--info-bg); color:var(--info); font-size:11px; font-weight:800; padding:3px 9px; border-radius:var(--pill); }
.vac-status { font-size:11px; font-weight:800; padding:3px 10px; border-radius:var(--pill); }
.vs-ok { background:var(--ok-bg); color:var(--ok); }
.vs-repair { background:var(--warn-bg); color:var(--warn); }
.vs-scrap { background:var(--surface-3); color:var(--ink-3); }
.vac-notes { font-size:12px; color:var(--ink-2); padding:0 15px 10px; }
.maint-box { border-top:1px solid var(--line-2); padding:11px 15px; background:var(--surface-2); }
.maint-title { font-size:11.5px; font-weight:800; color:var(--ink-3); margin-bottom:6px; letter-spacing:.3px; }
.maint-item { font-size:12px; color:var(--ink-2); padding:5px 0; border-bottom:1px solid var(--line-2); display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.maint-item:last-child { border-bottom:none; }
.maint-date { color:var(--ink-3); white-space:nowrap; font-size:11px; font-weight:600; }
.maint-empty { font-size:12px; color:var(--ink-3); padding:3px 0; }
.maint-del { border:none; background:none; color:#c3ccd4; cursor:pointer; font-size:13px; line-height:1; padding:0 2px; }
.maint-del:hover { color:var(--danger); }
.vac-actions { display:flex; gap:6px; padding:11px 15px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--line-2); }
.mini-btn { font-size:11px; padding:5px 11px; border-radius:8px; border:1px solid var(--info); background:transparent; color:var(--info); cursor:pointer; font-family:inherit; font-weight:700; transition:.15s; }
.mini-btn:hover { background:var(--info-bg); }
.mini-btn.warn { border-color:var(--warn); color:var(--warn); } .mini-btn.warn:hover{background:var(--warn-bg);}
.mini-btn.grey { border-color:#b3bfca; color:var(--ink-3); } .mini-btn.grey:hover { border-color:var(--danger); color:var(--danger); background:var(--danger-bg); }

/* ---------- FABs ---------- */
.admin-fab { position:fixed; bottom:22px; right:22px; padding:13px 22px; border:none; border-radius:var(--pill); font-size:14px; font-weight:700; cursor:pointer; z-index:200; transition:.25s; box-shadow:0 6px 20px rgba(20,35,48,.22); font-family:inherit; }
.admin-fab.locked { background:linear-gradient(135deg,var(--brand-1),var(--brand-3)); color:#fff; }
.admin-fab.unlocked { background:linear-gradient(135deg,var(--ok),#1aa055); color:#fff; }
.admin-fab:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(20,35,48,.3); }
.add-fab { position:fixed; bottom:22px; right:22px; padding:13px 24px; border:none; border-radius:var(--pill); font-size:15px; font-weight:700; cursor:pointer; z-index:200; background:linear-gradient(135deg,var(--info),#255ea0); color:#fff; box-shadow:0 6px 20px rgba(44,114,198,.3); font-family:inherit; display:none; }
.add-fab:hover { transform:translateY(-2px); }

/* ---------- Modals ---------- */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,25,33,.55); backdrop-filter:blur(3px); z-index:300; justify-content:center; align-items:center; padding:16px; }
.modal-overlay.show { display:flex; }
.modal-box { background:var(--surface); border-radius:20px; padding:28px; max-width:380px; width:100%; box-shadow:0 24px 70px rgba(15,25,33,.35); }
.modal-box h3 { font-size:20px; font-weight:800; margin-bottom:5px; }
.modal-box .modal-sub { font-size:13px; color:var(--ink-3); margin-bottom:18px; }
.modal-box input,.modal-box select,.form-modal textarea { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; font-family:inherit; margin-bottom:12px; background:var(--surface-2); transition:.2s; }
.modal-box input:focus,.modal-box select:focus,.form-modal textarea:focus { outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(31,111,124,.12); }
.form-modal textarea { resize:vertical; min-height:64px; }
.modal-btns { display:flex; gap:10px; }
.modal-btns button { flex:1; padding:11px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:.2s; }
.btn-login { background:linear-gradient(135deg,var(--brand-2),var(--brand-3)); color:#fff; }
.btn-login:hover { filter:brightness(1.06); }
.btn-cancel { background:var(--surface-3); color:var(--ink-2); }
.btn-cancel:hover { background:#dfe6ec; }
.modal-error { color:var(--danger); font-size:13px; margin-top:10px; display:none; font-weight:600; }
.form-modal { max-width:540px; max-height:90vh; overflow-y:auto; }
.form-modal .row2 { display:flex; gap:10px; }
.form-modal .row2 > div { flex:1; }
.form-modal label { display:block; font-size:12px; font-weight:700; color:var(--ink-2); margin-bottom:5px; }

function onPickImage(e, prefix) {
  var file = e.target.files[0];
  if (!file) return;
  var preview = document.getElementById(prefix + "ImgPreview");
  if (preview) preview.innerHTML = '<span class="no-img">⏳</span>';
  formImagePending[prefix] = resizeImage(file, 1000, 0.82).then(function (dataUrl) {
    if (dataUrl) {
      formImages[prefix] = dataUrl;
      if (preview) preview.innerHTML = '<img src="' + dataUrl + '">';
    }
  }).catch(function () {});
}
function resizeImage(file, maxDim, quality) {
  return new Promise(function (resolve) {
    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = reader.result;
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (!w || !h) { resolve(dataUrl); return; }
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        try {
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch (err) { resolve(dataUrl); }
      };
      img.onerror = function () { resolve(dataUrl); };
      img.src = dataUrl;
    };
    reader.onerror = function () { resolve(null); };
    reader.readAsDataURL(file);
  });
}

function slimHead(label, count, cls) {
  return '<div class="slim-head ' + (cls || "") + '"><span class="bar"></span>' + label + (count != null ? ' <span class="n">' + count + "</span>" : "") + "</div>";
}
function renderCleaning() {
  if (!products.length) return emptyState("🧴", "尚無清潔劑資料", "No chemicals yet");
  var f = moduleFilter.cleaning;
  if (f === "report") return renderReport();
  if (searchQuery) {
    var hits = products.filter(function (p) { return matchQuery([p.name_zh, p.name_en, p.subname_zh, p.subname_en]); });
    return hits.length ? '<div class="products-grid" style="margin-top:14px">' + hits.map(cleaningCard).join("") + "</div>" : noResult();
  }
  var exIds = expiringProductIds();
  var lowIds = lowStockIds();
  if (f === "expiring") {
    var exItems = products.filter(function (p) { return exIds.indexOf(p.id) >= 0; });
    return slimHead(currentLang === "zh" ? "⚠️ 即將到期 / 已過期（1 個月內）" : "⚠️ Expiring (≤30d)", exItems.length, "repair") +
      '<div class="products-grid">' + exItems.map(cleaningCard).join("") + "</div>";
  }
  if (f === "low") {
    var lowItems = products.filter(function (p) { return lowIds.indexOf(p.id) >= 0; });
    return slimHead(currentLang === "zh" ? "🛒 低於最低庫存，需補貨" : "🛒 Below reorder level", lowItems.length, "scrap") +
      '<div class="products-grid">' + lowItems.map(cleaningCard).join("") + "</div>";

  var actN = products.filter(function (p) { return p.status !== "停用"; }).length;
  var offN = products.length - actN;
  var cap = '<div class="mod-caption">' + (currentLang === "zh"
    ? "清潔劑 共 <b>" + products.length + "</b> 款　·　啟用 <b>" + actN + "</b>　·　<span class=\"off\">停用 " + offN + "</span>"
    : "<b>" + products.length + "</b> chemicals · <b>" + actN + "</b> active · <span class=\"off\">" + offN + " off</span>") + "</div>";
  if (lowIds.length) cap += '<div class="alert-expiry" style="background:var(--danger-bg);border-color:#f0b3ad;color:#a8362c" onclick="setFilter(\'low\')"><span class="ic">🛒</span><span>' +
    (currentLang === "zh" ? "有 <b>" + lowIds.length + "</b> 款清潔劑低於最低庫存，需補貨" : "<b>" + lowIds.length + "</b> chemicals below reorder level") +
    '</span><span class="go">' + (currentLang === "zh" ? "點此查看 →" : "view →") + "</span></div>";
  if (exIds.length) cap += '<div class="alert-expiry" onclick="setFilter(\'expiring\')"><span class="ic">⚠️</span><span>' +
    (currentLang === "zh" ? "有 <b>" + exIds.length + "</b> 款清潔劑即將到期或已過期（1 個月內）" : "<b>" + exIds.length + "</b> chemicals expiring or expired (≤30d)") +
    '</span><span class="go">' + (currentLang === "zh" ? "點此查看 →" : "view →") + "</span></div>";
  if (f === "disabled") {
    var dis = products.filter(function (p) { return p.status === "停用"; });
    return cap + (dis.length ? '<div class="products-grid">' + dis.map(cleaningCard).join("") + "</div>" : emptyState("🚫", "沒有停用產品", "No disabled products"));
  }
  if (f.indexOf("cat-") === 0) {
    var cid = +f.slice(4);
    var items = products.filter(function (p) { return p.status !== "停用" && p.category_id === cid; });
    return cap + '<div class="products-grid">' + items.map(cleaningCard).join("") + "</div>";
  }
  var body = "";
  categories.forEach(function (c) {
    var items = products.filter(function (p) { return p.status !== "停用" && p.category_id === c.id; });
    if (!items.length) return;
    body += slimHead(esc(c.icon) + " " + esc(currentLang === "zh" ? c.name_zh : c.name_en), items.length) +
      '<div class="products-grid">' + items.map(cleaningCard).join("") + "</div>";
  });
  return cap + (body || emptyState("🧴", "尚無啟用產品", "No active products"));
}

    "</div></div>" +

      '<tr><td class="dt-label" data-zh="兌水比例" data-en="Dilution">兌水比例</td><td class="dt-value" data-zh="' + esc(p.dilution_zh) + '" data-en="' + esc(p.dilution_en) + '">' + esc(p.dilution_zh) + "</td></tr>" +
      '<tr><td class="dt-label" data-zh="需要過水" data-en="Rinse">需要過水</td><td class="dt-value"><span class="' + (rinseYes ? "rinse-yes" : "rinse-no") + '" data-zh="' + esc(p.rinse_zh) + '" data-en="' + esc(p.rinse_en) + '">' + esc(p.rinse_zh) + "</span></td></tr>" +

function daysUntil(dateStr) {
  if (!dateStr) return null;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var d = new Date(dateStr + "T00:00:00");
  return Math.round((d - today) / 86400000);
}
// batches expiring within 30 days (incl. already expired), with stock remaining
function isActiveProduct(id) { var p = products.find(function (x) { return x.id === id; }); return p && p.status !== "停用"; }
// expiring batches — only for 上架中 (active) products
function expiringProductIds() {
  var ids = {};
  batches.forEach(function (b) {
    if (!b.expiry_date || Number(b.qty_remaining) <= 0) return;
    if (!isActiveProduct(b.product_id)) return;
    var d = daysUntil(b.expiry_date);
    if (d !== null && d <= 30) ids[b.product_id] = 1;
  });
  return Object.keys(ids).map(Number);
}
// products at/below reorder level — only for 上架中 (active) products
function lowStockIds() {
  return products.filter(function (p) { var m = Number(p.min_stock) || 0; return p.status !== "停用" && m > 0 && Number(p.stock) < m; }).map(function (p) { return p.id; });
}
function batchListHtml(p) {
  var list = batchesOf(p.id);
  if (!list.length) return "";
  var rows = list.map(function (b) {
    var cls = "exp-none", label;
    if (b.expiry_date) {
      var d = daysUntil(b.expiry_date);
      cls = d < 0 ? "exp-past" : d <= 30 ? "exp-soon" : "exp-ok";
      label = b.expiry_date + (d < 0 ? (currentLang === "zh" ? "（已過期）" : " (expired)") : d <= 30 ? (currentLang === "zh" ? "（剩" + d + "天）" : " (" + d + "d)") : "");
    } else {
      label = currentLang === "zh" ? "未設效期" : "No expiry";
    }
    var adminBtns = isAdmin
      ? '<button class="batch-mini" onclick="openBatchEdit(' + b.id + ')" title="編輯">✎</button><button class="batch-mini del" onclick="deleteBatch(' + b.id + ')" title="刪除">✕</button>'
      : "";
    return '<div class="batch-item"><span class="exp-dot ' + cls + '"></span>' +
      '<span class="batch-exp">' + esc(label) + "</span>" +
      '<span class="batch-qty">' + b.qty_remaining + "</span>" + adminBtns + "</div>";
  }).join("");
  return '<div class="batch-box"><div class="batch-title" data-zh="效期批次" data-en="Batches">效期批次</div>' + rows + "</div>";
}

function setReportPeriod(pd) { reportPeriod = pd; render(); }
function renderReport() {
  var labels = { month: { zh: "月", en: "Month" }, quarter: { zh: "季", en: "Quarter" }, year: { zh: "年", en: "Year" } };
  var controls = '<div class="report-controls">' + ["month", "quarter", "year"].map(function (pd) {
    return '<button class="period-btn' + (reportPeriod === pd ? " active" : "") + '" onclick="setReportPeriod(\'' + pd + '\')">' +
      (currentLang === "zh" ? labels[pd].zh : labels[pd].en) + "</button>";
  }).join("") + "</div>";
  if (!movements.length) return controls + emptyState("📊", "尚無用量記錄（盤點後就會有）", "No usage yet — do a stock count first");

  function keyOf(dateStr) {
    var d = new Date(dateStr + "T00:00:00"), y = d.getFullYear();
    if (reportPeriod === "year") return "" + y;
    if (reportPeriod === "quarter") return y + " Q" + (Math.floor(d.getMonth() / 3) + 1);
    return y + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  var periods = {}, byProd = {};
  movements.forEach(function (m) {
    var k = keyOf(m.happened_on); periods[k] = 1;
    byProd[m.product_id] = byProd[m.product_id] || {};
    byProd[m.product_id][k] = (byProd[m.product_id][k] || 0) + m.qty;
  });
  var pkeys = Object.keys(periods).sort().reverse();
  var prodIds = Object.keys(byProd).map(Number);
  function prodName(id) { var p = products.find(function (x) { return x.id === id; }); return p ? p.name_zh : "#" + id; }

  var head = "<tr><th>" + (currentLang === "zh" ? "產品" : "Product") + "</th>" +
    pkeys.map(function (k) { return "<th>" + esc(k) + "</th>"; }).join("") +
    "<th>" + (currentLang === "zh" ? "合計" : "Total") + "</th></tr>";
  var rows = prodIds.map(function (id) {
    var total = 0;
    var tds = pkeys.map(function (k) { var q = byProd[id][k] || 0; total += q; return "<td>" + (q || "") + "</td>"; }).join("");
    return "<tr><td>" + esc(prodName(id)) + "</td>" + tds + "<td><b>" + total + "</b></td></tr>";
  }).join("");
  var colTotals = {}, grand = 0;
  pkeys.forEach(function (k) { var s = 0; prodIds.forEach(function (id) { s += byProd[id][k] || 0; }); colTotals[k] = s; grand += s; });
  var totalRow = '<tr class="total-row"><td>' + (currentLang === "zh" ? "總計" : "Total") + "</td>" +
    pkeys.map(function (k) { return "<td>" + colTotals[k] + "</td>"; }).join("") + "<td>" + grand + "</td></tr>";

  return controls + '<div class="report-scroll"><table class="report-table"><thead>' + head + "</thead><tbody>" + rows + totalRow + "</tbody></table></div>";
}

function openCatManagerForModule() {
  document.getElementById("settingsMenu").classList.remove("show");
  openCatManager(currentModule);  // cleaning | tool | equipment
}
function updateSettingsUI() {
  var lc = document.getElementById("langCur"); if (lc) lc.textContent = currentLang === "zh" ? "中文" : "EN";
  var ab = document.getElementById("setAdminBtn");
  if (ab) {
    if (isAdmin) { ab.className = "set-item on"; ab.textContent = currentLang === "zh" ? "🔓 已登入（點此登出）" : "🔓 Logged in (log out)"; }
    else { ab.className = "set-item"; ab.textContent = currentLang === "zh" ? "🔒 管理員登入" : "🔒 Admin log in"; }
  }
  var cb = document.getElementById("setCatBtn");
  if (cb) {
    var CAT_LABEL = { cleaning: "清潔劑分類", tool: "工具分類", equipment: "設備類型", vacuum: "樓層/區域" };
    var show = isAdmin && CAT_LABEL[currentModule];
    cb.style.display = show ? "flex" : "none";
    if (show) cb.textContent = "⚙ " + (currentLang === "zh" ? "管理" + CAT_LABEL[currentModule] : "Manage categories");
  }
}
function toggleAdmin() { document.getElementById("settingsMenu").classList.remove("show"); if (isAdmin) { logout(); return; } openLogin(); }
function openLogin() {
  document.getElementById("loginModal").classList.add("show");
  document.getElementById("pwdInput").value = "";
  var e = document.getElementById("modalError");
  e.textContent = currentLang === "zh" ? "密碼錯誤，請重試" : "Wrong password, please try again";
  e.style.display = "none";
  setTimeout(function () { document.getElementById("pwdInput").focus(); }, 100);
}
function closeModal() { document.getElementById("loginModal").classList.remove("show"); }
async function doLogin() {
  var pwd = document.getElementById("pwdInput").value;
  if (!pwd) return;
  var loginBtn = document.querySelector("#loginModal .btn-login");
  var errEl = document.getElementById("modalError");
  loginBtn.textContent = "..."; loginBtn.disabled = true; errEl.style.display = "none";
  var res = await sb.rpc("verify_password", { p_password: pwd });
  loginBtn.textContent = currentLang === "zh" ? "登入" : "Login"; loginBtn.disabled = false;
  if (!res.error && res.data === true) {
    currentPwd = pwd; isAdmin = true;
    closeModal();
    render();
  } else if (res.error) {
    errEl.textContent = currentLang === "zh" ? "無法連接伺服器" : "Cannot connect to server"; errEl.style.display = "block";
  } else {
    errEl.textContent = currentLang === "zh" ? "密碼錯誤，請重試" : "Wrong password, please try again"; errEl.style.display = "block";
  }
}
function logout() {
  isAdmin = false; currentPwd = "";
  render();
}

// ============================================================================
//  Local cache helpers + errors
// ============================================================================
function replaceLocal(arr, row) {
  if (!row) return;
  var i = arr.findIndex(function (x) { return x.id === row.id; });
  if (i >= 0) arr[i] = row;
}
function upsertLocal(arr, row) {
  if (!row) return;
  var i = arr.findIndex(function (x) { return x.id === row.id; });
  if (i >= 0) arr[i] = row; else arr.push(row);
}
function friendlyError(err) {
  var msg = (err && err.message) || "";
  if (/wrong password/i.test(msg)) return currentLang === "zh" ? "密碼錯誤" : "Wrong password";
  if (/not configured/i.test(msg)) return currentLang === "zh" ? "尚未設定密碼" : "Password not set";
  return currentLang === "zh" ? "操作失敗：" + msg : "Failed: " + msg;
}
function adminErr(err) {
  if (/wrong password/i.test((err && err.message) || "")) {
    logout(); openLogin();
    document.getElementById("modalError").textContent = currentLang === "zh" ? "密碼已失效，請重新登入" : "Session expired, please log in again";
    document.getElementById("modalError").style.display = "block";
  } else {
    alert(friendlyError(err));
  }
}

// ---- lightbox (click any card image to view large) ----
function openLightbox(src) { document.getElementById("lbImg").src = src; document.getElementById("lightbox").classList.add("show"); }
function closeLightbox() { document.getElementById("lightbox").classList.remove("show"); }
document.addEventListener("click", function (e) {
  var img = e.target.closest ? e.target.closest(".product-img img, .vac-img img") : null;
  if (img && img.src) { e.stopPropagation(); openLightbox(img.src); }
});

window.onload = loadAll;
